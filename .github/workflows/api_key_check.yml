name: Auto-Update API Key

on:
  schedule:
    - cron: '0 4 * * *'  # Täglich um 04:00 Uhr morgens
  workflow_dispatch:      # Ermöglicht manuellen Start zum Testen

jobs:
  update_secret_job:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v3

      - name: Python einrichten
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Abhängigkeiten installieren
        run: |
          pip install requests beautifulsoup4

      - name: Key scrapen und Secret updaten
        env:
          # Hier nutzen wir den mächtigen Token für den Schreibzugriff
          GH_TOKEN: ${{ secrets.SECRET_UPDATER_TOKEN }}
        run: |
          # 1. Python Skript ausführen und Ausgabe in Variable speichern
          NEW_KEY=$(python source/fetch_api_key.py)
          
          if [ -z "$NEW_KEY" ]; then
            echo "❌ Fehler: Kein Key gefunden!"
            exit 1
          fi

          echo "✅ Key gefunden (Länge: ${#NEW_KEY} Zeichen)"
          
          # 2. Secret mit GitHub CLI (gh) aktualisieren
          # Das Secret heißt hier 'BUNDESTAG_API_KEY'
          echo "$NEW_KEY" | gh secret set BUNDESTAG_API_KEY
          
          echo "✅ GitHub Secret 'BUNDESTAG_API_KEY' erfolgreich aktualisiert."