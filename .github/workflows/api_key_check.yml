name: Auto-Update API Key

on:
  schedule:
    - cron: '0 4 * * *'  # Täglich um 04:00 Uhr morgens
  workflow_dispatch:      # Ermöglicht manuellen Start zum Testen

jobs:
  update_secret_job:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v3

      - name: Python einrichten
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Abhängigkeiten installieren
        run: |
          pip install requests beautifulsoup4

      - name: Key scrapen und Secret updaten
        env:
          # Hier nutzen wir den mächtigen Token für den Schreibzugriff
          GH_TOKEN: ${{ secrets.SECRET_UPDATER_TOKEN }}
        run: |
          echo "Start Scraper..."
          
          # Wir führen das Skript aus. Wenn es fehlschlägt (exit 1), bricht der Step sofort ab
          # und die Fehlermeldungen von stderr (siehe Python Script oben) werden rot angezeigt.
          NEW_KEY=$(python source/fetch_api_key.py)
          
          # Prüfen ob Variable leer ist (Sicherheitshalber)
          if [ -z "$NEW_KEY" ]; then
            echo "❌ Fehler: Python Skript lief durch, hat aber keinen Key zurückgegeben."
            exit 1
          fi

          echo "✅ Key gefunden (Länge: ${#NEW_KEY} Zeichen)"
          
          # Secret updaten
          echo "$NEW_KEY" | gh secret set BUNDESTAG_API_KEY
          echo "✅ GitHub Secret aktualisiert."