name: Full Ingest – Bundestag Data

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run: check connection only (no data download)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  full-ingest:
    runs-on: [self-hosted, vps]
    timeout-minutes: 2880  # 48 hours; embeddings build alone can take ~34 h on first run
    permissions:
      contents: write

    env:
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      BUNDESTAG_API_KEY: ${{ secrets.BUNDESTAG_API_KEY }}
      DIP_USER_AGENT: "Mozilla/5.0 (compatible; bundeswarehouse/1.0; +https://github.com/test-pls-ignore/bundeswarehouse)"
      DIP_REQUEST_DELAY: "1.0"
      DIP_MAX_RETRIES: "12"
      DIP_RETRY_BACKOFF_MAX: "900"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python virtualenv
        run: |
          python3 --version
          python3 -m venv .venv
          .venv/bin/python -m ensurepip --upgrade
          .venv/bin/python -m pip install --upgrade pip
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: .venv/bin/python -m pip install -r requirements.txt

      - name: Validate Bundestag API key is present
        run: |
          if [ -z "${BUNDESTAG_API_KEY}" ]; then
            echo "BUNDESTAG_API_KEY is not set. Add it as a repository secret." >&2
            exit 1
          fi

      - name: Check S3 connection
        run: .venv/bin/python -m pipeline.cli check-connection

      - name: Run full ingest
        if: ${{ inputs.dry_run != 'true' }}
        run: .venv/bin/python -m pipeline.cli full-load

      - name: Materialize warehouse snapshot
        if: ${{ inputs.dry_run != 'true' }}
        run: .venv/bin/python -m pipeline.cli materialize --output warehouse.duckdb

      - name: Restore embeddings database from S3
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          .venv/bin/python - << 'EOF'
          from pipeline.storage import get_s3_client, get_bucket_name, download_file
          client = get_s3_client()
          bucket = get_bucket_name()
          key = "embeddings/wp20/embeddings.duckdb"
          found = download_file(client, bucket, key, "embeddings.duckdb")
          if not found:
              print(f"No existing embeddings.duckdb at s3://{bucket}/{key}; starting fresh.")
          EOF

      - name: Build Wahlperiode document embeddings
        if: ${{ inputs.dry_run != 'true' }}
        run: .venv/bin/python -m analytics.extract --warehouse warehouse.duckdb --embeddings embeddings.duckdb --wahlperiode 20

      - name: Persist embeddings database to S3
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          .venv/bin/python - << 'EOF'
          from pipeline.storage import get_s3_client, get_bucket_name, upload_file
          client = get_s3_client()
          bucket = get_bucket_name()
          key = "embeddings/wp20/embeddings.duckdb"
          upload_file(client, bucket, key, "embeddings.duckdb")
          EOF

      - name: Upload embedding artifacts
        if: ${{ inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: rag-index-wp-20-${{ github.run_id }}
          retention-days: 14
          path: |
            warehouse.duckdb
            embeddings.duckdb

      - name: Commit updated state.json
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git add state.json
          git commit -m "chore: update state after full ingest [skip ci]" || echo "No state changes to commit."
          git push
