name: Full Ingest – Bundestag Data

on:
  workflow_dispatch:
    inputs:
      wahlperiode:
        description: "Wahlperiode to index (e.g. 20)"
        required: false
        default: "20"
        type: string
      dry_run:
        description: "Dry-run: check connection only (no data download)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      skip_full_load:
        description: "Skip raw ingest and reuse existing raw/current/ snapshot (saves ~7 h download; runs materialize/planning/indexing only)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      target_docs_per_partition:
        description: "Target number of pending documents per partition"
        required: false
        default: "200"
        type: string
      max_parallel:
        description: "Maximum number of partition jobs to run in parallel"
        required: false
        default: "4"
        type: string
      workers:
        description: "Concurrent PDF downloads per partition worker"
        required: false
        default: "8"
        type: string
      batch:
        description: "Documents processed per extractor batch inside each partition"
        required: false
        default: "256"
        type: string
      max_attempts:
        description: "Skip unchanged failed documents after this many attempts"
        required: false
        default: "3"
        type: string
      partition_limit:
        description: "Limit planned partitions for fast test runs (0 = all)"
        required: false
        default: "0"
        type: string

permissions:
  actions: read
  contents: write

jobs:
  full-ingest:
    runs-on: [self-hosted, vps]
    timeout-minutes: 480
    permissions:
      contents: write

    env:
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      BUNDESTAG_API_KEY: ${{ secrets.BUNDESTAG_API_KEY }}
      DIP_USER_AGENT: "Mozilla/5.0 (compatible; bundeswarehouse/1.0; +https://github.com/test-pls-ignore/bundeswarehouse)"
      DIP_REQUEST_DELAY: "1.0"
      DIP_MAX_RETRIES: "12"
      DIP_RETRY_BACKOFF_MAX: "900"
      MEMORY_MAX: "5600M"

    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_partitions: ${{ steps.plan.outputs.has_partitions }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up shared Python virtualenv (persisted across partition jobs)
        # embed-partitions runs this ~100+ times per invocation, once per
        # matrix partition, all sequentially on the one self-hosted runner.
        # Rebuilding the venv + reinstalling torch/sentence-transformers
        # from scratch every single time was the dominant cost of the
        # ~1.5-day embed-partitions phase. Building it once at a fixed path
        # *outside* $GITHUB_WORKSPACE (which actions/checkout wipes via
        # `git clean -ffdx` every job) and reusing it - rebuilding only
        # when requirements.txt actually changes - turns ~100 full installs
        # into one real install plus near-instant reuse for every job
        # after it. flock serializes this in case jobs ever race on it
        # (e.g. if max_parallel is raised with more runners later).
        env:
          VENV_DIR: /home/christian/bw-ci-venv
        run: |
          exec 9>"$VENV_DIR.lock"
          flock 9

          REQ_HASH="$(sha256sum requirements.txt | cut -d' ' -f1)"
          STAMP_FILE="$VENV_DIR/.requirements-hash"
          if [ -f "$STAMP_FILE" ] && [ "$(cat "$STAMP_FILE")" = "$REQ_HASH" ] && [ -x "$VENV_DIR/bin/python" ]; then
            echo "Reusing existing venv at $VENV_DIR (requirements.txt unchanged)."
          else
            echo "Building venv at $VENV_DIR (requirements.txt changed or first run)..."
            rm -rf "$VENV_DIR"
            python3 -m venv "$VENV_DIR"
            "$VENV_DIR/bin/python" -m ensurepip --upgrade
            "$VENV_DIR/bin/python" -m pip install --upgrade pip
            "$VENV_DIR/bin/python" -m pip install torch --index-url https://download.pytorch.org/whl/cpu
            "$VENV_DIR/bin/python" -m pip install -r requirements.txt
            echo "$REQ_HASH" > "$STAMP_FILE"
          fi
          echo "$VENV_DIR/bin" >> "$GITHUB_PATH"

      - name: Validate Bundestag API key is present
        run: |
          if [ -z "${BUNDESTAG_API_KEY}" ]; then
            echo "BUNDESTAG_API_KEY is not set. Add it as a repository secret." >&2
            exit 1
          fi

      - name: Check S3 connection
        run: python -m pipeline.cli check-connection

      - name: Run full ingest
        if: ${{ inputs.dry_run != 'true' && inputs.skip_full_load != 'true' }}
        run: python -m pipeline.cli full-load

      - name: Materialize warehouse snapshot
        if: ${{ inputs.dry_run != 'true' }}
        run: python -m pipeline.cli materialize --output warehouse.duckdb

      - name: Plan pending document partitions
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          python -m analytics.extract \
            --warehouse warehouse.duckdb \
            --embeddings planner.duckdb \
            --wahlperiode "${{ inputs.wahlperiode }}" \
            --max-attempts "${{ inputs.max_attempts }}" \
            --target-docs-per-partition "${{ inputs.target_docs_per_partition }}" \
            --plan-output plan.json

      - name: Export partition matrix
        id: plan
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads(Path("plan.json").read_text(encoding="utf-8"))
          partitions = plan["partitions"]
          partition_limit = int("${{ inputs.partition_limit }}")
          if partition_limit < 0:
              raise ValueError(f"partition_limit must be >= 0, got {partition_limit}")
          if partition_limit > 0:
              partitions = partitions[:partition_limit]
              plan["partitions"] = partitions
              plan["partition_count"] = len(partitions)
              plan["total_docs"] = sum(p["doc_count"] for p in partitions)
          matrix = json.dumps(partitions, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={matrix}\n")
              fh.write(f"has_partitions={'true' if partitions else 'false'}\n")
          print(json.dumps(plan, indent=2))
          PY

      - name: Upload plan and warehouse snapshot
        if: ${{ inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: full-ingest-plan-${{ github.run_id }}
          retention-days: 14
          path: |
            warehouse.duckdb
            plan.json

      - name: Commit updated state.json
        if: ${{ inputs.dry_run != 'true' && inputs.skip_full_load != 'true' }}
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git add state.json
          git commit -m "chore: update state after full ingest [skip ci]" || echo "No state changes to commit."
          git push

  embed-partitions:
    needs: full-ingest
    if: inputs.dry_run != 'true' && needs.full-ingest.outputs.has_partitions == 'true'
    runs-on: [self-hosted, vps]
    timeout-minutes: 300
    permissions:
      contents: read

    env:
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}

    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        partition: ${{ fromJSON(needs.full-ingest.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up shared Python virtualenv (persisted across partition jobs)
        # embed-partitions runs this ~100+ times per invocation, once per
        # matrix partition, all sequentially on the one self-hosted runner.
        # Rebuilding the venv + reinstalling torch/sentence-transformers
        # from scratch every single time was the dominant cost of the
        # ~1.5-day embed-partitions phase. Building it once at a fixed path
        # *outside* $GITHUB_WORKSPACE (which actions/checkout wipes via
        # `git clean -ffdx` every job) and reusing it - rebuilding only
        # when requirements.txt actually changes - turns ~100 full installs
        # into one real install plus near-instant reuse for every job
        # after it. flock serializes this in case jobs ever race on it
        # (e.g. if max_parallel is raised with more runners later).
        env:
          VENV_DIR: /home/christian/bw-ci-venv
        run: |
          exec 9>"$VENV_DIR.lock"
          flock 9

          REQ_HASH="$(sha256sum requirements.txt | cut -d' ' -f1)"
          STAMP_FILE="$VENV_DIR/.requirements-hash"
          if [ -f "$STAMP_FILE" ] && [ "$(cat "$STAMP_FILE")" = "$REQ_HASH" ] && [ -x "$VENV_DIR/bin/python" ]; then
            echo "Reusing existing venv at $VENV_DIR (requirements.txt unchanged)."
          else
            echo "Building venv at $VENV_DIR (requirements.txt changed or first run)..."
            rm -rf "$VENV_DIR"
            python3 -m venv "$VENV_DIR"
            "$VENV_DIR/bin/python" -m ensurepip --upgrade
            "$VENV_DIR/bin/python" -m pip install --upgrade pip
            "$VENV_DIR/bin/python" -m pip install torch --index-url https://download.pytorch.org/whl/cpu
            "$VENV_DIR/bin/python" -m pip install -r requirements.txt
            echo "$REQ_HASH" > "$STAMP_FILE"
          fi
          echo "$VENV_DIR/bin" >> "$GITHUB_PATH"

      - name: Download partition plan and warehouse snapshot
        uses: actions/download-artifact@v4.1.3
        with:
          name: full-ingest-plan-${{ github.run_id }}

      - name: Build partition embeddings
        run: |
          python -m analytics.extract \
            --warehouse warehouse.duckdb \
            --embeddings partition.duckdb \
            --wahlperiode "${{ inputs.wahlperiode }}" \
            --max-attempts "${{ inputs.max_attempts }}" \
            --workers "${{ inputs.workers }}" \
            --batch "${{ inputs.batch }}" \
            --updated-month "${{ matrix.partition.updated_month }}" \
            --shard-index "${{ matrix.partition.shard_index }}" \
            --shard-count "${{ matrix.partition.shard_count }}" \
            --skip-index

      - name: Validate generated partition database
        run: |
          python -m analytics.extract \
            --embeddings partition.duckdb \
            --validate-db

      - name: Export partition to Parquet
        run: |
          python -m analytics.extract \
            --embeddings partition.duckdb \
            --export-parquet shard-artifact/ \
            --export-parquet-prefix "${{ matrix.partition.partition_id }}"

      - name: Upload partition artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-ingest-shard-${{ matrix.partition.partition_id }}
          retention-days: 14
          path: shard-artifact/

  merge-embeddings:
    needs: [full-ingest, embed-partitions]
    if: inputs.dry_run != 'true' && needs.full-ingest.outputs.has_partitions == 'true'
    uses: ./.github/workflows/merge_embeddings.yml
    secrets: inherit
    with:
      source_run_id: ${{ github.run_id }}
      wahlperiode: ${{ inputs.wahlperiode }}
