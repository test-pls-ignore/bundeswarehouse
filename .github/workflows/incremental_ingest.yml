name: Incremental Ingest – Bundestag Data

on:
  schedule:
    - cron: "0 3 * * *"   # Daily at 03:00 UTC
  workflow_dispatch:        # Allow manual trigger

jobs:
  incremental-ingest:
    runs-on: [self-hosted, vps]

    env:
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      BUNDESTAG_API_KEY: ${{ secrets.BUNDESTAG_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check S3 connection
        run: python -m pipeline.cli check-connection

      - name: Run incremental update
        run: python -m pipeline.cli incremental-update

      - name: Commit updated state.json
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git add state.json
          git commit -m "chore: update state after incremental ingest [skip ci]" || echo "No state changes to commit."
          git push
