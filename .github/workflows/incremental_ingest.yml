name: Incremental Ingest – Bundestag Data

on:
  schedule:
    - cron: "0 3 1 * *"   # Daily at 03:00 UTC
  workflow_dispatch:        # Allow manual trigger

jobs:
  incremental-ingest:
    runs-on: [self-hosted, vps]
    permissions:
      contents: write

    env:
      S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      BUNDESTAG_API_KEY: ${{ secrets.BUNDESTAG_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python virtualenv
        # This job only ever targets [self-hosted, vps] (see runs-on above),
        # so the venv is always created unconditionally — no need to gate on
        # runner type. (`runner.labels` is not a real GitHub Actions context
        # field; a condition on it silently evaluates to false and skips
        # this step, leaving .venv/bin/pip missing for the next step.)
        run: |
          python3 --version
          python3 -m venv .venv
          .venv/bin/python3 -m ensurepip --upgrade
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Install PyTorch (CPU-only)
        run: .venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: .venv/bin/pip install -r requirements.txt

      - name: Check S3 connection
        run: python -m pipeline.cli check-connection

      - name: Run incremental update
        run: python -m pipeline.cli incremental-update

      - name: Materialize warehouse snapshot
        run: python -m pipeline.cli materialize --output warehouse.duckdb

      - name: Update Wahlperiode document embeddings
        run: python -m analytics.extract --warehouse warehouse.duckdb --embeddings embeddings.duckdb --wahlperiode 20

      - name: Upload embedding artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rag-index-wp-20-${{ github.run_id }}
          retention-days: 14
          path: |
            warehouse.duckdb
            embeddings.duckdb

      - name: Commit updated state.json
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git add state.json
          git commit -m "chore: update state after incremental ingest [skip ci]" || echo "No state changes to commit."
          git push
