name: Merge Embeddings

on:
  workflow_call:
    inputs:
      source_run_id:
        required: true
        type: string
      wahlperiode:
        required: false
        default: "20"
        type: string
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Workflow run ID that produced full-ingest-plan-* and full-ingest-shard-* artifacts"
        required: true
        type: string
      wahlperiode:
        description: "Wahlperiode label for the artifact output"
        required: false
        default: "20"
        type: string

jobs:
  merge-embeddings:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    permissions:
      actions: read
      contents: read

    env:
      MEMORY_MAX: "5600M"
      VPS_DATA_DIR: /home/christian/bundeswarehouse
      VPS_SSH_PORT: 2225

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python virtualenv
        run: |
          python3 --version
          python3 -m venv .venv
          .venv/bin/python -m ensurepip --upgrade
          .venv/bin/python -m pip install --upgrade pip
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Install PyTorch (CPU-only)
        run: .venv/bin/python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: .venv/bin/python -m pip install -r requirements.txt

      - name: Download plan and warehouse snapshot
        uses: actions/download-artifact@v4.1.3
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          name: full-ingest-plan-${{ inputs.source_run_id }}

      - name: Download partition shard artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: shards
          pattern: full-ingest-shard-*
          merge-multiple: true

      - name: Merge partition databases
        run: |
          .venv/bin/python -m analytics.extract \
            --embeddings embeddings.duckdb \
            --merge-dir shards \
            --skip-index

      - name: Configure SSH access
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/merge_embeddings_key"
          chmod 600 "$HOME/.ssh/merge_embeddings_key"

          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/merge_embeddings_known_hosts"
          chmod 644 "$HOME/.ssh/merge_embeddings_known_hosts"

      - name: Publish merged data files to the VPS
        # This job runs on ubuntu-latest (GitHub-hosted), so unlike the
        # self-hosted ingest workflows it cannot just `cp` into
        # VPS_DATA_DIR directly - it has to go over the network. scp
        # straight into <name>.new-<run_id> *inside* VPS_DATA_DIR (not /tmp)
        # so the final `mv` on the remote side is a same-filesystem rename
        # (atomic for any reader with the old file already open), matching
        # the publish pattern used by the self-hosted workflows.
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          SUFFIX="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          SCP="scp -i $HOME/.ssh/merge_embeddings_key -o UserKnownHostsFile=$HOME/.ssh/merge_embeddings_known_hosts -P $VPS_SSH_PORT"
          SSH="ssh -i $HOME/.ssh/merge_embeddings_key -o UserKnownHostsFile=$HOME/.ssh/merge_embeddings_known_hosts -p $VPS_SSH_PORT"

          $SCP warehouse.duckdb "$VPS_USER@$VPS_HOST:$VPS_DATA_DIR/warehouse.duckdb.new-$SUFFIX"
          $SCP embeddings.duckdb "$VPS_USER@$VPS_HOST:$VPS_DATA_DIR/embeddings.duckdb.new-$SUFFIX"

          $SSH "$VPS_USER@$VPS_HOST" bash -s -- "$VPS_DATA_DIR" "$SUFFIX" <<'EOF'
          set -euo pipefail
          DATA_DIR="$1"
          SUFFIX="$2"
          mv -f "$DATA_DIR/warehouse.duckdb.new-$SUFFIX" "$DATA_DIR/warehouse.duckdb"
          mv -f "$DATA_DIR/embeddings.duckdb.new-$SUFFIX" "$DATA_DIR/embeddings.duckdb"
          EOF

      - name: Clean up local SSH files
        if: always()
        run: |
          if command -v shred >/dev/null 2>&1; then
            shred -u "$HOME/.ssh/merge_embeddings_key" 2>/dev/null || rm -f "$HOME/.ssh/merge_embeddings_key"
          else
            rm -f "$HOME/.ssh/merge_embeddings_key"
          fi
          rm -f "$HOME/.ssh/merge_embeddings_known_hosts"

      - name: Upload final embedding artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rag-index-wp-${{ inputs.wahlperiode }}-${{ github.run_id }}
          retention-days: 14
          path: |
            warehouse.duckdb
            embeddings.duckdb
            plan.json
