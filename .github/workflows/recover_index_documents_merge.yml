name: Recover RAG Merge from Artifacts

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Workflow run ID from 'Index Documents for RAG' to recover"
        required: true
        type: string
      wahlperiode:
        description: "Wahlperiode label for recovered artifact naming"
        required: false
        default: "20"
        type: string

jobs:
  recover-merge:
    runs-on: [self-hosted, vps]
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python virtualenv (self-hosted)
        run: |
          python3 --version
          python3 -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download warehouse snapshot and plan from source run
        uses: actions/download-artifact@v4.1.3
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          name: rag-index-plan-${{ inputs.source_run_id }}

      - name: Download partition shard artifacts from source run
        uses: actions/download-artifact@v4.1.3
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: shards
          pattern: rag-shard-*
          merge-multiple: true

      - name: Validate downloaded shard databases
        id: validate-shards
        continue-on-error: true
        run: |
          set +e
          failed=0
          for shard in shards/*.duckdb; do
            [ -f "$shard" ] || continue
            echo "Validating: $shard"
            python -m analytics.extract --embeddings "$shard" --validate-db
            if [ $? -ne 0 ]; then
              echo "::warning::Shard validation failed: $shard"
              failed=1
            fi
          done
          exit $failed

      - name: Discard corrupt shard databases
        if: steps.validate-shards.outcome == 'failure'
        run: |
          set +e
          removed=0
          for shard in shards/*.duckdb; do
            [ -f "$shard" ] || continue
            python -m analytics.extract --embeddings "$shard" --validate-db > /dev/null 2>&1
            if [ $? -ne 0 ]; then
              echo "Removing corrupt shard: $shard"
              rm -f "$shard"
              removed=$((removed + 1))
            fi
          done
          echo "::warning::Removed $removed corrupt shard(s). Merge will proceed with remaining valid shards."

      - name: Merge partition databases
        run: |
          python -m analytics.extract \
            --embeddings embeddings.duckdb \
            --merge-dir shards

      - name: Upload recovered embedding artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rag-index-recovered-wp-${{ inputs.wahlperiode }}-from-${{ inputs.source_run_id }}-${{ github.run_id }}
          retention-days: 14
          path: |
            warehouse.duckdb
            embeddings.duckdb
            plan.json
