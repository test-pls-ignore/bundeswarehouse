name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies (no PyTorch)
        run: |
          pip install boto3 duckdb requests botocore

      - name: Run unit tests
        run: python -m pytest tests/test_pipeline_smoke.py -v
