name: Web Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/web_deploy.yml"
  workflow_dispatch:

concurrency:
  group: web-deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-web:
    runs-on: ubuntu-latest
    env:
      WEB_APP_DIR: /home/christian/bundeswarehouse/web
      WEB_SERVICE_NAME: bundeswarehouse-web
      VPS_SSH_PORT: 2225
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Package deployment tarball
        run: |
          rm -f /tmp/web-deploy-artifact.tar.gz
          tar -czf /tmp/web-deploy-artifact.tar.gz \
            .next \
            public \
            package.json \
            package-lock.json \
            next.config.ts

      - name: Configure SSH access
        working-directory: ${{ github.workspace }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/web_deploy_key"
          chmod 600 "$HOME/.ssh/web_deploy_key"

          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/web_deploy_known_hosts"
          chmod 644 "$HOME/.ssh/web_deploy_known_hosts"

      - name: Upload deployment tarball to VPS
        working-directory: ${{ github.workspace }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          REMOTE_TARBALL="/tmp/web-deploy-artifact-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          printf 'REMOTE_TARBALL=%s\n' "$REMOTE_TARBALL" >> "$GITHUB_ENV"

          scp \
            -i "$HOME/.ssh/web_deploy_key" \
            -o UserKnownHostsFile="$HOME/.ssh/web_deploy_known_hosts" \
            -P "$VPS_SSH_PORT" \
            /tmp/web-deploy-artifact.tar.gz \
            "$VPS_USER@$VPS_HOST:$REMOTE_TARBALL"

      - name: Deploy build artifact and restart service over SSH
        working-directory: ${{ github.workspace }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/web_deploy_key" \
            -o UserKnownHostsFile="$HOME/.ssh/web_deploy_known_hosts" \
            -p "$VPS_SSH_PORT" \
            "$VPS_USER@$VPS_HOST" \
            bash -s -- "$WEB_APP_DIR" "$WEB_SERVICE_NAME" "$REMOTE_TARBALL" <<'EOF'
          set -euo pipefail

          WEB_APP_DIR="$1"
          WEB_SERVICE_NAME="$2"
          DEPLOY_TARBALL="$3"

          if [ ! -d "$WEB_APP_DIR" ]; then
            echo "Target web app directory does not exist: $WEB_APP_DIR" >&2
            exit 1
          fi

          if [ ! -f "$DEPLOY_TARBALL" ]; then
            echo "Deployment tarball does not exist on VPS: $DEPLOY_TARBALL" >&2
            exit 1
          fi

          find "$WEB_APP_DIR" -maxdepth 1 -type d -name '.next.new.stale.*' -mtime +7 -exec rm -rf {} +
          find "$WEB_APP_DIR" -maxdepth 1 -type d -name 'public.new.stale.*' -mtime +7 -exec rm -rf {} +

          python3 - "$DEPLOY_TARBALL" <<'PY'
          import posixpath
          import sys
          import tarfile

          allowed_exact = {".next", "public", "package.json", "package-lock.json", "next.config.ts"}
          allowed_prefixes = (".next/", "public/")

          with tarfile.open(sys.argv[1], "r:gz") as tarball:
              for member in tarball.getmembers():
                  normalized = posixpath.normpath(member.name)
                  path_parts = [part for part in normalized.split("/") if part not in ("", ".")]

                  if member.issym() or member.islnk():
                      raise SystemExit(f"Validation failed: deployment tarball contains a link entry: {member.name}")

                  if not (member.isdir() or member.isreg()):
                      raise SystemExit(f"Validation failed: deployment tarball contains an unsupported entry type: {member.name}")

                  if normalized.startswith("/") or any(part == ".." for part in path_parts):
                      raise SystemExit(f"Validation failed: deployment tarball contains an unsafe path: {member.name}")

                  if normalized not in allowed_exact and not any(
                      normalized.startswith(prefix) for prefix in allowed_prefixes
                  ):
                      raise SystemExit(f"Validation failed: deployment tarball contains an unexpected path: {member.name}")
          PY

          DEPLOY_TMP_DIR="$(mktemp -d /tmp/web-deploy-extract.XXXXXX)"
          trap 'rm -rf "$DEPLOY_TMP_DIR"' EXIT
          tar -xzf "$DEPLOY_TARBALL" \
            --no-absolute-names \
            --no-same-owner \
            --no-same-permissions \
            -C "$DEPLOY_TMP_DIR"

          if [ ! -d "$DEPLOY_TMP_DIR/.next" ]; then
            echo "Deployment tarball is missing .next output." >&2
            exit 1
          fi

          cp "$DEPLOY_TMP_DIR/package.json" "$WEB_APP_DIR/package.json"
          cp "$DEPLOY_TMP_DIR/package-lock.json" "$WEB_APP_DIR/package-lock.json"
          cp "$DEPLOY_TMP_DIR/next.config.ts" "$WEB_APP_DIR/next.config.ts"

          cd "$WEB_APP_DIR"
          npm ci --omit=dev

          if [ -d "$WEB_APP_DIR/.next.new" ] || [ -d "$WEB_APP_DIR/public.new" ]; then
            STALE_SUFFIX="$(date +%s)"
            [ -d "$WEB_APP_DIR/.next.new" ] && mv "$WEB_APP_DIR/.next.new" "$WEB_APP_DIR/.next.new.stale.$STALE_SUFFIX"
            [ -d "$WEB_APP_DIR/public.new" ] && mv "$WEB_APP_DIR/public.new" "$WEB_APP_DIR/public.new.stale.$STALE_SUFFIX"
          fi

          cp -a "$DEPLOY_TMP_DIR/.next" "$WEB_APP_DIR/.next.new"
          cp -a "$DEPLOY_TMP_DIR/public" "$WEB_APP_DIR/public.new"

          sudo systemctl stop "$WEB_SERVICE_NAME"
          rm -rf "$WEB_APP_DIR/.next.prev" "$WEB_APP_DIR/public.prev"
          [ -d "$WEB_APP_DIR/.next" ] && mv "$WEB_APP_DIR/.next" "$WEB_APP_DIR/.next.prev"
          [ -d "$WEB_APP_DIR/public" ] && mv "$WEB_APP_DIR/public" "$WEB_APP_DIR/public.prev"
          mv "$WEB_APP_DIR/.next.new" "$WEB_APP_DIR/.next"
          mv "$WEB_APP_DIR/public.new" "$WEB_APP_DIR/public"

          if ! sudo systemctl start "$WEB_SERVICE_NAME"; then
            echo "Failed to start $WEB_SERVICE_NAME. Rolling back previous web assets..." >&2
            rm -rf "$WEB_APP_DIR/.next" "$WEB_APP_DIR/public"
            [ -d "$WEB_APP_DIR/.next.prev" ] && mv "$WEB_APP_DIR/.next.prev" "$WEB_APP_DIR/.next"
            [ -d "$WEB_APP_DIR/public.prev" ] && mv "$WEB_APP_DIR/public.prev" "$WEB_APP_DIR/public"
            if ! sudo systemctl start "$WEB_SERVICE_NAME"; then
              echo "Rollback restart also failed for $WEB_SERVICE_NAME." >&2
              sudo systemctl --no-pager --full status "$WEB_SERVICE_NAME" || true
            fi
            exit 1
          fi

          rm -rf "$WEB_APP_DIR/.next.prev" "$WEB_APP_DIR/public.prev"
          rm -rf "$DEPLOY_TMP_DIR" "$DEPLOY_TARBALL"
          trap - EXIT
          sudo systemctl show "$WEB_SERVICE_NAME" -p NRestarts
          sudo systemctl --no-pager --full status "$WEB_SERVICE_NAME"
          EOF

      - name: Clean up local SSH and tarball files
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          if command -v shred >/dev/null 2>&1; then
            shred -u "$HOME/.ssh/web_deploy_key" 2>/dev/null || rm -f "$HOME/.ssh/web_deploy_key"
          else
            rm -f "$HOME/.ssh/web_deploy_key"
          fi

          rm -f "$HOME/.ssh/web_deploy_known_hosts"
          rm -f /tmp/web-deploy-artifact.tar.gz
